interface:
  display_name: "SDLC"
  short_description: "Coordinate gated SDLC skills"
  default_prompt: "Use the sdlc skill as the lightweight coordinator for a phase-gated workflow. Immediately create and maintain an explicit checklist, load the relevant subskill before each phase, enforce confirmation/review/commit gates, and do not perform phase work from memory. Keep all requirements, planning docs, progress docs, state updates, code edits, and task-owned commits in the selected task branch/worktree; never create, stage, or commit task-owned changes from the canonical/shared root checkout, which must stay clean on `main` and update only by fetch/pull from `origin/main`. Maintain one persistent TPM reviewer and one persistent architect reviewer across requirements, Phase 0, functional-plan, technical-plan, and execution-plan review; optionally add persistent DBA or UX reviewers when the work materially needs them. Send deltas to the same reviewers instead of spawning fresh reviewers, then close the refinement bench after execution-plan acceptance unless explicitly told otherwise. Reviewer sub-agents in this workflow must not fork the full parent context; send only the relevant delta, diff or artifact excerpt, AC rows, review brief, and focused evidence packet they need to judge. Require final AC verification matrix signoff for every Product AC, Technical AC, and Negative AC row before calling a wave complete. Delegate detailed requirements, refactor-health, functional planning, technical planning, execution planning, slice implementation, slice review, and state handling to the narrower skills."
