interface:
  display_name: "SDLC State"
  short_description: "Maintain compact SDLC state"
  default_prompt: "Use the sdlc-state skill to create or update a compact .sdlc/state.json execution index without replacing planning artifacts, final AC verification matrices, independent reviews, verification gates, or progress docs. Keep state small, structured, and resumable. Write state only in the selected task branch/worktree; never create, stage, or commit state/progress changes from the canonical/shared root checkout, which must stay clean on `main` and update only by fetch/pull from `origin/main`."
