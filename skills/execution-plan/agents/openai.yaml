interface:
  display_name: "Execution Plan"
  short_description: "Create the reviewed slice execution plan"
  default_prompt: "Use the execution-plan skill to create a reviewed slice-based execution plan where every slice has tests-first expectations, targeted verification, review/fix before broad verification, and an immediate commit after the slice is review-clean and green. Include both an AC trace table for planned coverage and a final AC verification matrix for behavior-level proof and reviewer signoff. Each slice must name its assigned AC rows, expected AC coverage verdict, required proof depth, final matrix rows, and compact AC/TAC reviewer packet. For every assigned AC row, explicitly say whether the slice must close it now, preserve it as partial until a named later gate, or only guard against regression; a reviewer must block any slice that claims to close a row without proof at the required boundary. Reviewer agents in this workflow must not fork the full parent context; plan for compact no-fork review packets built from the relevant diff or artifact excerpt, AC rows, review brief, closure rule per row, and focused evidence. Convert Phase 0 hotspot findings into early prep slices, deletion/split/extraction work, or enforceable no-growth guardrails before dependent feature slices. Reuse the existing refinement-wave TPM reviewer and architect reviewer instead of spawning fresh reviewers; create them only if they do not already exist. Include persistent DBA or UX reviewers when the slice plan carries database or UX risk. Use `frontier-review` for delegated refinement reviewers when available, then close the refinement bench after execution-plan acceptance unless explicitly told otherwise. Create or update execution-plan docs only in the selected task branch/worktree, stage only execution-plan doc paths, and commit them before implementation starts when the repo workflow permits commits; never create, stage, or commit planning docs from the canonical/shared root checkout, which must stay clean on `main` and update only by fetch/pull from `origin/main`; otherwise report the blocker and dirty doc paths."
